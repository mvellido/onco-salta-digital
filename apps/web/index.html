<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Onco-Salta Digital</title>
    
    <!-- 👇 AGREGAR LA FUENTE INTER DESDE GOOGLE FONTS -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <style>
      /* 👇 ESTILOS GLOBALES PARA APLICAR LA FUENTE Y MEJORAR LA EXPERIENCIA */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      /* Estilos para mejorar la accesibilidad y el enfoque por teclado */
      :focus {
        outline: 2px solid #2563eb;
        outline-offset: 2px;
      }
      
      /* Estilos para scroll suave */
      html {
        scroll-behavior: smooth;
      }
    </style>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
